plugins {
    alias(libs.plugins.android.application)
}

def loadKeystoreProperties() {
    def props = new Properties()
    def keyFile = file("keystore.properties")
    if (keyFile.exists()) {
        keyFile.withInputStream { props.load(it) }
        return props
    }
    def gradlePropsFile = file("../gradle.properties")
    if (gradlePropsFile.exists()) {
        gradlePropsFile.withInputStream { props.load(it) }
    }
    if (!props.containsKey('storeFile') || props['storeFile'] == null) {
        throw new GradleException(
            "签名证书未配置。请在 app/ 目录创建 keystore.properties 文件。\n参考 keystore.properties.sample 模板。"
        )
    }
    return props
}

android {
    namespace 'com.ark.jiagu'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.ark.jiagu"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "2.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug() {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
    defaultConfig {
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    splits {
        abi {
            enable false
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    signingConfigs {
        debug {
            def _p = loadKeystoreProperties()
            storeFile file(_p.storeFile)
            storePassword _p.storePassword
            keyAlias _p.keyAlias
            keyPassword _p.keyPassword
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
        }
        release {
            def _p = loadKeystoreProperties()
            storeFile file(_p.storeFile)
            storePassword _p.storePassword
            keyAlias _p.keyAlias
            keyPassword _p.keyPassword
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
        }
    }
}

configurations.configureEach {
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
}

dependencies {
    implementation fileTree(dir:'libs',include:['*.jar'])
    implementation 'com.android.tools.smali:smali-dexlib2:3.0.9'
    implementation "androidx.activity:activity:1.9.0"
    implementation 'com.github.TimScriptov:apksigner:1.2.0'
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.78.1'
    //implementation "androidx.appcompat:appcompat:1.7.0"
    //implementation libs.material

}